x-backend-environment: &backend-environment
  NODE_ENV: development
  PORT: "4000"
  DATABASE_URL: postgresql://hospital_booking:hospital_booking_dev@postgres:5432/hospital_booking_dev?schema=public
  TEST_DATABASE_URL: postgresql://hospital_booking:hospital_booking_dev@postgres:5432/hospital_booking_test?schema=public
  QUEUE_REDIS_URL: redis://redis:6379/0
  FRONTEND_URL: http://localhost:3000
  FRONTEND_URLS: http://localhost:3000,http://localhost:3001
  APP_BASE_URL: http://localhost:4000
  JWT_SECRET: docker_local_jwt_secret_not_for_production_2026
  OTP_SECRET: docker_local_otp_secret_not_for_production_2026
  LOOKUP_GRANT_SECRET: docker_local_lookup_secret_not_for_production_2026
  OTP_DEBUG_ENABLED: "true"
  PAYMENT_MOCK_ENABLED: "true"
  PAYMENT_MOMO_ENABLED: "false"
  CLOUDINARY_URL: cloudinary://docker_local_key:docker_local_secret@docker_local_cloud
  FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:-}
  ELASTICSEARCH_ENABLED: "false"
  WORKER_LOG_NOOP: "false"

x-backend-runtime: &backend-runtime
  build:
    context: ./backend
    target: runtime
  image: hospital-booking-backend:local
  environment: *backend-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    backend-migrate:
      condition: service_completed_successfully
  init: true
  restart: unless-stopped
  networks:
    - hospital_internal

services:
  backend-migrate:
    build:
      context: ./backend
      target: build
    image: hospital-booking-backend-migrate:local
    command: ["npm", "run", "prisma:migrate:deploy"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - hospital_internal

  backend-api:
    <<: *backend-runtime
    command: ["npm", "start"]
    ports:
      - "${HOSPITAL_BACKEND_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  otp-worker:
    <<: *backend-runtime
    command: ["npm", "run", "worker:otp"]

  appointment-worker:
    <<: *backend-runtime
    command: ["npm", "run", "worker:appointments"]

  notification-worker:
    <<: *backend-runtime
    command: ["npm", "run", "worker:notifications"]
    profiles: ["notifications"]
