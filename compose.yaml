name: hospital-booking

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${HOSPITAL_POSTGRES_USER:-hospital_booking}
      POSTGRES_PASSWORD: ${HOSPITAL_POSTGRES_PASSWORD:-hospital_booking_dev}
      POSTGRES_DB: ${HOSPITAL_POSTGRES_DB:-hospital_booking_dev}
    ports:
      - "${HOSPITAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - hospital_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - hospital_internal

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    ports:
      - "${HOSPITAL_REDIS_PORT:-6380}:6379"
    volumes:
      - hospital_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - hospital_internal

networks:
  hospital_internal:
    name: hospital-booking-internal

volumes:
  hospital_postgres_data:
  hospital_redis_data:
